version: '3.8'

services:
  bot-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-trade
    # Enable TTY for Rich dashboard display
    tty: true
    stdin_open: true
    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    # Mount volumes for config and data persistence
    volumes:
      # Mount config file (read-only)
      - ./src/trade/config.yaml:/app/src/trade/config.yaml:ro
      # Mount logs directory for data persistence
      - ./res/logs:/app/res/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
