version: '3.8'

services:
  bot-trade:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-trade
    # Volumes removed - using container storage only
    environment:
      - PYTHONUNBUFFERED=1
      # Add any other environment variables your application needs
      # - TELEGRAM_TOKEN=your_token_here
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
