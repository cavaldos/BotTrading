# Backtest environment configuration (example values).
# Note: fallback defaults are shown inline as `default: ...`.

# Data source
currencies: # default: ["BTCUSDT"]
  - "BTCUSDT"
  - "ETHUSDT"
  - "BNBUSDT"

timeframes: # default: ["5m", "15m"] (used by data fetch utilities)
  - "5m"
  - "15m"

folder_path: "res/data" # default: "res/data"
candles_limit: 2000 # default: 2000 (when mode="by_candles")
start_date: "2026-01-01" # default: "2026-01-01" (when mode="by_date")
mode: "by_candles" # default: "by_candles" ("by_candles" | "by_date")

# Backtest outputs
output_folder: "res/output" # default: "res/output"
report_folder: "res/report" # default: "res/report"
backtest_results_file: "backtest_results" # default: "backtest_results" (without extension)

# Strategy settings are loaded from: src/config/strategy.yaml
# - signal_timeframe (supports list)
# - entry_timeframe
