# Shared strategy configuration used by both live and backtest.
# Example file with baseline values.

# Risk/Reward
risk_reward_ratio: 2.0 # default: 2.0

# Multi-timeframe
entry_timeframe: "1m" # default: "1m" (execution timeframe)
signal_timeframe: # default: ["5m"] (supports multiple signal timeframes)
  - "5m"

# Structure Detection
swing_length: 10 # default: 10
internal_length: 3 # default: 3

# EQH/EQL Detection
eqhl_length: 3 # default: 3
eqhl_threshold: 0.3 # default: 0.3

# Order Block
ob_mitigation: "close" # default: "high_low" ("close" | "high_low")
ob_body_ratio: 0.35 # default: 0.35

# Entry Filters
require_liquidity: true # default: true
require_reversal_pattern: true # default: true
enable_simple_reversal: true # default: true
simple_reversal_wick_ratio: 0.25 # default: 0.25
touch_tolerance_pct: 0.0 # default: 0.0
touch_confirmation_bars: 0 # default: 0
entry_on_candle_close: false # default: true (backtest), false (live execute fallback)

# Risk Management
sl_buffer_pct: 0.1 # default: 0.1
sl_multiplier: 1.05 # default: 1.05
min_sl_pct: 0.05 # default: 0.05
risk_per_trade: 10.0 # default: 10.0
reversal_pattern_ids: [0] # default: [0]
