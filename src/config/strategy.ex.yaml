# Shared strategy configuration used by both live and backtest.
# Note: fallback defaults are shown inline as `default: ...`.

# Strategy package: src/strategy/<strategy>/ (its Config fields are the settings below)
strategy: "smc" # default: "smc"

# Risk/Reward
risk_reward_ratio: 2.0 # default: 2.0

# Multi-timeframe
entry_timeframe: "1m" # default: "1m" (execution timeframe)
signal_timeframe: # default: ["5m"] (supports multiple signal timeframes)
  - "2m"
  - "3m"
  - "5m"
slice_window: 1000 # default: 0 (0 = disabled, >0 = single-pass rolling active window on signal timeframe)

# Structure Detection
swing_length: 11 # default: 10
internal_length: 3 # default: 3

# EQH/EQL Detection
eqhl_length: 3 # default: 3
eqhl_threshold: 0.4 # default: 0.3

# Order Block
mitigation_mode: "high_low" # default: "high_low" ("close" | "high_low")
ob_body_ratio: 0.25 # default: 0.25
max_active_obs_per_bias: 15 # default: 10 (keep only the most recent bullish/bearish OBs)
merge_overlapping_obs: true # default: true (gop cac OB cung bias neu overlap va hinh thanh gan nhau)
ob_merge_max_break_gap: 5 # default: 5 (so bar toi da giua cac structure break de duoc gop OB)
entry_ob_level: 0.5 # default: 0.5 (level the confirmation candle must trade through: 0.0=low, 0.5=midpoint, 1.0=high)

# Entry Filters (optional HTF touch-bar filter)
require_liquidity: true # default: true
require_opposite_liquidity_target: true # default: true (needs opposite-side OB or EQH/EQL or FVG/IFVG)

require_reversal_pattern: true # default: true
enable_simple_reversal: true # default: true
simple_reversal_wick_ratio: 0.25 # default: 0.25
min_reversal_pattern_matches: 1 # default: 1 (pattern families that must match on the same candle)
doji_body_ratio: 0.1 # default: 0.1 (doji: body <= ratio * range)
tweezer_tolerance_ratio: 0.1 # default: 0.1 (tweezer: |low1-low2| <= ratio * avg range)
block_choch_against_entry_mode: "ifvg" # default: "off" (block only when CHOCH + entry candle against trade + selected gap is IFVG)

trend_filter_timeframe: "" # default: "" (off). e.g. "15m": LONG only above EMA, SHORT only below EMA (last closed candle)
trend_filter_ema_length: 50 # default: 50

enable_adx_filter: true # default: false (require ADX >= adx_threshold on signal timeframe)
adx_length: 7 # tuned best in optimization sweep
adx_threshold: 24.0 # tuned best in optimization sweep

gap_filter_mode: "both" # default: "none" ("none" | "fvg" | "ifvg" | "both")
fvg_atr_filter: true # default: true (legacy name, applies FVG/IFVG auto-threshold filter)

touch_tolerance_pct: 0.02 # default: 0.0
touch_confirmation_bars: 0 # default: 0
entry_on_candle_close: false # unused by SMC: entries always fill at the close of the confirmation candle

reversal_pattern_ids: [0] # default: [0] = all (see src/indicators/reversal_patterns.py)


# Risk Management
sl_buffer_pct: 0.1 # default: 0.1
sl_multiplier: 1.1 # default: 1.05
min_sl_pct: 0.2 # default: 0.05
risk_per_trade: 1.0 # default: 10.0
fee_per_trade_r: 0.5 # default: 0.5 (phí giao dịch tính bằng R, trừ cho mỗi lệnh đã đóng)


# Flexible TP
tp_mode: "htf_level_or_rr" # default: "htf_liquidity_or_rr" ("fixed_rr" | "opposite_ob" | "opposite_swing" | "opposite_ob_or_swing" | "htf_liquidity" | "htf_liquidity_or_rr" | "htf_level" | "htf_level_or_rr")
tp_no_target_policy: "fixed_rr" # default: "fixed_rr" ("skip" | "fixed_rr")
tp_swing_length: 5 # default: 5
flex_tp_risk_boost_factor: 0.0 # default: 0.0 (boost risk_per_trade when flex RR is above base RR)


# SL / TP at higher-timeframe key levels (swing highs/lows, EQH/EQL, OB, FVG)
# The first timeframe in the list that has a usable level wins (15m, else 10m); SL and TP are picked separately.
# Only levels already confirmed and not yet traded through at entry are used.
# Trades CSV columns SL_Source / TP_Source say where they went (e.g. "15m swing low", "10m OB", "OB", "RR").
level_timeframe: ["15m", "10m"] # default: [] (off)
level_sources: ["swing", "eqhl", "ob", "fvg"] # default: all four
level_swing_length: 5 # default: 5 (candles on each side of a swing high/low)
level_lookback_bars: 200 # default: 200 (only levels formed in the last N level candles, 0 = all)
sl_mode: "level_or_zone" # default: "zone" ("zone" = entry OB | "level" = key level or skip | "level_or_zone" = key level, else entry OB)
level_sl_buffer_pct: 0.05 # default: 0.05 (SL this % beyond the level)
max_sl_pct: 0.0 # default: 0.0 (a level SL wider than this % does not count, 0 = no limit)
level_tp_buffer_pct: 0.0 # default: 0.0 (TP this % before the level)
level_tp_min_rr: 1.0 # default: 1.0 (TP level must give at least this RR; 0 = nearest level; used with tp_mode htf_level / htf_level_or_rr)
