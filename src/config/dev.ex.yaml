
# ===================================================================
## Data Configuration DEV
# ===================================================================
currencies:
  - "BTCUSDT"
  - "ETHUSDT"
  - "BNBUSDT"

# List of timeframes
timeframes:
  - "5m"
  - "15m"

# Directory path to save data
folder_path: "res/data"
# Number of candles to fetch (for mode: by_candles)
candles_limit: 2000

# Start date for fetching data (for mode: by_date, format: YYYY-MM-DD)
start_date: "2026-01-01"

# Fetch mode: "by_candles" or "by_date"
mode: "by_candles"

# Output folder for trade reports
output_folder: "res/output"

# Folder for markdown summary report
report_folder: "res/report"

# Backtest results filename (without extension)
backtest_results_file: "backtest_results"

# ===================================================================
## Run Configuration
# ===================================================================

# Strategy settings
strategy:
  risk_reward_ratio: 2.0  # RR ratio for take profit calculation
  # === STRUCTURE DETECTION ===
  swing_length: 10          # Lookback for swing structure
  internal_length: 3        # Lookback for internal structure
  # === EQH/EQL DETECTION ===
  eqhl_length: 3            # Length for EQH/EQL detection
  eqhl_threshold: 0.3       # ATR multiplier for EQH/EQL sensitivity
  # === ORDER BLOCK ===
  ob_mitigation: "close" # "close" or "high_low"
  ob_body_ratio: 0.35       # Body size / candle range filter
  # === FVG ===
  fvg_atr_filter: true      # Filter small FVGs using ATR
  # === RISK MANAGEMENT ===
  sl_buffer_pct: 0.1        # Buffer SL (% of OB range)
  sl_multiplier: 1.05       # SL expansion factor (avoid stop hunt)
  min_sl_pct: 0.05          # Minimum SL % - don't place order if SL < x% of entry price
  risk_per_trade: 10.0      # USD per trade

