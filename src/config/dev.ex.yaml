
# ===================================================================
## Data Configuration DEV
# ===================================================================
currencies:
  - "BTCUSDT"
  - "ETHUSDT"
  - "BNBUSDT"

# List of timeframes
timeframes:
  - "5m"
  - "15m"

# Directory path to save data
folder_path: "res/data"
# Number of candles to fetch (for mode: by_candles)
candles_limit: 2000

# Start date for fetching data (for mode: by_date, format: YYYY-MM-DD)
start_date: "2026-01-01"

# Fetch mode: "by_candles" or "by_date"
mode: "by_candles"


# ===================================================================
## Run Configuration
# ===================================================================

# Strategy settings
strategy:
  risk_reward_ratio: 2.0  # RR ratio for take profit calculation
  min_sl_pct: 0.05  # Minimum SL % - don't place order if SL < x% of entry price
  ob_body_ratio: 0.35  # Order Block body ratio filter (body size / candle range)

# Output folder for trade reports
output_folder: "res/output"

# Folder for markdown summary report
report_folder: "res/report"

# Backtest results filename (without extension)
backtest_results_file: "backtest_results"