# Trade Application Configuration

# Data settings
data:
  folder: "res/logs/data"
  currencies:
    - "BTCUSDT"
  candles_limit: 2000

# Output settings
output:
  folder: "res/logs/output"
  log_file: "res/logs/sent_orders.json"

# Timeframe settings - supports single timeframe or list of timeframes
timeframe:
  value: ["5m", "15m","30m"]   # Timeframe(s) to use: 1m, 5m, 15m, 30m, 1h, 4h, 1d. Can be string or list
  delay_seconds: 2      # Delay after candle close before fetching data
  run_on_start: true    # Run immediately when app starts

# Dashboard settings
dashboard:
  refresh_rate: 2       # Refresh rate per second
  max_logs: 10          # Maximum number of logs to display
