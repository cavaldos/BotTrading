# Trade Application Configuration

# Data settings
data:
  folder: "res/live/data"
  currencies:
    - "BTCUSDT"
  candles_limit: 2000

# Output settings
output:
  folder: "res/live/output"
  log_file: "res/logs/sent_orders.json"

# Timeframe settings
timeframe:
  value: "5m"           # Timeframe to use: 1m, 5m, 15m, 30m, 1h, 4h, 1d
  delay_seconds: 5      # Delay after candle close before fetching data
  run_on_start: true    # Run immediately when app starts

# Dashboard settings
dashboard:
  refresh_rate: 2       # Refresh rate per second
  max_logs: 10          # Maximum number of logs to display
