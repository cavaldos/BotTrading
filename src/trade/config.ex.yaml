# Trade Application Configuration TRADE

# Data settings
data:
  folder: "res/logs/data"
  currencies:
    - "BTCUSDT"
    - "BNBUSDT"

  candles_limit: 2000

# Output settings
output:
  folder: "res/logs/output"
  log_file: "res/logs/sent_orders.json"

# Timeframe settings
timeframe:
  value: ["5m" ,"15m"]          # Timeframe to use: 1m, 5m, 15m, 30m, 1h, 4h, 1d
  fetch_interval: 60   # Interval in seconds between each fetch cycle

# Dashboard settings
dashboard:
  refresh_rate: 2       # Refresh rate per second
  max_logs: 10           # Maximum number of logs to display

# Strategy settings
strategy:
  risk_reward_ratio: 2.0    # RR ratio for take profit calculation
  # === STRUCTURE DETECTION ===
  swing_length: 10          # Lookback for swing structure
  internal_length: 3        # Lookback for internal structure
  # === EQH/EQL DETECTION ===
  eqhl_length: 3            # Length for EQH/EQL detection
  eqhl_threshold: 0.3       # ATR multiplier for EQH/EQL sensitivity
  # === ORDER BLOCK ===
  ob_mitigation: "high_low" # "close" or "high_low"
  ob_body_ratio: 0.35       # Body size / candle range filter
  # === FVG ===
  fvg_atr_filter: true      # Filter small FVGs using ATR
  # === RISK MANAGEMENT ===
  sl_buffer_pct: 0.1        # Buffer SL (% of OB range)
  sl_multiplier: 1.05       # SL expansion factor (avoid stop hunt)
  min_sl_pct: 0.05          # Minimum SL % - don't place order if SL < x% of entry price
  risk_per_trade: 5         # Risk amount in USD per trade
